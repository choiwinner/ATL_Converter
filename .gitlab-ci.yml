# 사내 GitLab CI 파이프라인 설정
stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/pip
    - .cache/uv
    - .venv/

default:
  image: python:3.10-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install uv
    - uv venv .venv
    - . .venv/bin/activate
    - uv pip install -e ".[dev]"

# 1. 린트 및 코드 스타일 검사 (AI 코드의 스타일 일관성 유지)
lint_and_format:
  stage: lint
  script:
    - . .venv/bin/activate
    - ruff check .
    - ruff format --check .
    - mypy src/

# 2. 단위 테스트 및 Golden Regression Test 검사
unit_and_golden_tests:
  stage: test
  script:
    - . .venv/bin/activate
    - pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

# 3. 배포 패키지 빌드 (main 브랜치 또는 태그 푸시 시)
build_artifact:
  stage: build
  script:
    - . .venv/bin/activate
    - uv build
  artifacts:
    paths:
      - dist/*
    expire_in: 1 month
  only:
    - main
    - tags
