name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정 (3.10)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: uv 설치 및 가상환경 구성
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: 코드 스타일 & 린트 검사
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: 정적 타입 검사 (Mypy)
        run: |
          source .venv/bin/activate
          mypy src/

      - name: 단위 테스트 및 골든 샘플 검증 (Pytest)
        run: |
          source .venv/bin/activate
          pytest --cov=src --cov-report=xml
